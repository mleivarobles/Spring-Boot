<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad ProChile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 700px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 72px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 4px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
        }

        h2 {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 16px;
            margin: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .status {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status span {
            font-size: 18px;
            opacity: 0.8;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">&#127464;&#127473;</div>
        <h1>¡Hola Mundo!</h1>
        <h2>Comunidad ProChile</h2>
        <div>
            <span class="badge">Spring Boot</span>
            <span class="badge">Java 25</span>
            <span class="badge">Azure Web App</span>
        </div>
        <div class="status">
            <span class="status-dot"></span>
            <span>Servicio activo - Ambiente de Test</span>
        </div>
        <div class="footer">
            Portal de contacto con la ciudadanía
        </div>
    </div>
</body>
</html>
